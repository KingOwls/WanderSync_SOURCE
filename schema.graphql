type Booking {
  id: String!
  userId: Int!
  flightId: String
  outboundFlightId: String!
  returnFlightId: String
  hotelId: String!
  carId: String!
  total: Float!
  status: String!
  paymentStatus: String!
  failureReason: String
  createdAt: String!
}

type Car {
  id: String!
  provider: String!
  model: String!
  city: String!
  dailyPrice: Float!
  currency: String!
  category: String
  source: String!
  sourceUrl: String!
  snapshotId: String!
  scrapedAt: String!
}

type CatalogUpdate {
  startedAt: String
  finishedAt: String
  status: String!
  intervalHours: Int!
}

type DatabaseStatus {
  connected: Boolean!
  database: String!
  dbUser: String!
  users: Int!
  flights: Int!
  hotels: Int!
  cars: Int!
  orders: Int!
}

type DateCombination {
  departureDate: String!
  returnDate: String!
  nights: Int!
  lowestOutboundPrice: Float!
  lowestReturnPrice: Float!
  lowestFlightTotal: Float!
}

type Flight {
  id: String!
  airline: String!
  origin: String!
  destination: String!
  travelDate: String!
  departureAt: String
  arrivalAt: String
  price: Float!
  currency: String!
  source: String!
  sourceUrl: String!
  snapshotId: String!
  scrapedAt: String!
}

type FlightAvailabilityResult {
  origin: String!
  destination: String!
  dates: [FlightDateOption!]!
}

type FlightDateOption {
  travelDate: String!
  directOfferCount: Int!
  connectionCandidateCount: Int!
}

type FlightSearchResult {
  origin: String!
  destination: String!
  travelDate: String!
  status: String!
  availableCount: Int!
  sourcesChecked: Int!
  sourcesAvailable: Int!
  directOffers: [Flight!]!
  connections: [SuggestedConnection!]!
  totalCount: Int!
  hasMore: Boolean!
  offset: Int!
}

type Hotel {
  id: String!
  name: String!
  roomType: String
  city: String!
  nightlyPrice: Float!
  currency: String!
  rating: Float
  source: String!
  sourceUrl: String!
  snapshotId: String!
  scrapedAt: String!
}

type ItineraryLeg {
  label: String!
  date: String!
  origin: String!
  destination: String!
  departureAt: String
  arrivalAt: String
  durationMinutes: Int
  timeConfirmed: Boolean!
}

type Mutation {
  register(email: String!, fullName: String!, password: String!): User!
  login(email: String!, password: String!): User!
  logout: Boolean!
  checkoutPackage(outboundFlightId: String!, returnFlightId: String!, idempotencyKey: String!, hotelId: String!, carId: String!, nights: Int!, total: Float!, simulateFailure: String = null): Booking!
}

type Query {
  catalogUpdate: CatalogUpdate!
  sessionInfo: SessionInfo!
  me: User
  flightOffers(origin: String!, destination: String!, limit: Int! = 20, travelDate: String = null): [Flight!]!
  travelNetwork: TravelNetwork!
  sourceHealth: SourceHealthSummary!
  flightAvailability(origin: String!, destination: String!, startDate: String = null, endDate: String = null, limit: Int! = 90): FlightAvailabilityResult!
  flightSearch(origin: String!, destination: String!, travelDate: String!, limit: Int! = 10, offset: Int! = 0): FlightSearchResult!
  travelAvailability(origin: String!, destination: String!, outboundLimit: Int! = 90, returnLimit: Int! = 90, startDate: String = null, endDate: String = null): TravelAvailability!
  travelPackages(origin: String!, destination: String!, startDate: String!, endDate: String!, limit: Int! = 8): [TravelPackage!]!
  myBookings: [Booking!]!
  sagaEvents(orderId: String!): [SagaEvent!]!
  databaseStatus: DatabaseStatus!
  securityStatus: SecurityStatus!
}

type SagaEvent {
  id: Int!
  orderId: String!
  step: String!
  action: String!
  status: String!
  detail: String
  createdAt: String!
}

type SecurityStatus {
  passwordHashing: String!
  sessionFixationProtection: String!
  cookiePolicy: String!
  loginRateLimit: String!
  checkoutRateLimit: String!
  paymentRateLimit: String!
  dependencyAudit: String!
}

type SessionInfo {
  authenticated: Boolean!
  sessionPrefix: String!
  createdAt: String
  rotatedAt: String
  userEmail: String
}

type SourceHealthItem {
  source: String!
  status: String!
  available: Boolean!
  itemsFound: Int!
  finishedAt: String
}

type SourceHealthSummary {
  activeCount: Int!
  totalCount: Int!
  sources: [SourceHealthItem!]!
}

type SuggestedConnection {
  via: String!
  stops: Int!
  totalPrice: Float!
  currency: String!
  legs: [Flight!]!
  warning: String!
}

type TravelAvailability {
  origin: String!
  destination: String!
  airportCodes: [String!]!
  outboundDates: [String!]!
  returnDates: [String!]!
  outboundOfferCount: Int!
  returnOfferCount: Int!
  combinations: [DateCombination!]!
}

type TravelCity {
  code: String!
  name: String!
  airports: [String!]!
}

type TravelNetwork {
  cities: [TravelCity!]!
  routes: [TravelRoute!]!
}

type TravelPackage {
  id: String!
  outboundFlight: Flight!
  returnFlight: Flight!
  hotel: Hotel!
  car: Car!
  nights: Int!
  flightTotal: Float!
  total: Float!
  itinerary: [ItineraryLeg!]!
  warnings: [String!]!
  priceBasis: String!
}

type TravelRoute {
  origin: String!
  destination: String!
  offerCount: Int!
  sources: [String!]!
  outboundAvailable: Boolean!
  roundTripAvailable: Boolean!
  packageAvailable: Boolean!
  firstDate: String
  lastDate: String
  lowestPrice: Float
  coverageStatus: String!
  visibleOfferCount: Int!
  rawOfferCount: Int!
  sourcesChecked: Int!
  sourcesAvailable: Int!
}

type User {
  id: Int!
  email: String!
  fullName: String!
}